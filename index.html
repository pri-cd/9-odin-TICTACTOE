<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/script.js" defer></script>
</head>

<body>
    <header class="header">
        <img class="logo" src="./assets/icons/logo.png" alt="A icon representing a tic-tac-toe game.">
        <h1>Tic-Tac-Toe</h1>
    </header>

    <main class="main">
        <button type="button" id="btn-start" class="btn-start">Start Game</button>
        <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>


        <dialog class="player-dialog" id="player-dialog">
            <div class="dialog-header">
                <img src="./assets/icons/dialog-logo.png" alt="">
                <h2>Enter player names</h2>
            </div>

            <div class="player-1 player-input" id="player-1">
                <label for="player-1-name">Name (P1):</label>
                <input type="text" name="name" id="player-1-name" placeholder="Player 1">
            </div>
            <div class="player-2 player-input" id="player-2">
                <label for="player-2-name">Name (P2):</label>
                <input type="text" name="name" id="player-2-name" placeholder="Player 2">
            </div>

            <div class="submit">
                <button id="btn-submit-p-names" type="button">Submit</button>
            </div>
        </dialog>
    </main>

    <footer class="footer"></footer>
</body>

</html>
